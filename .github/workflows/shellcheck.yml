name: Checks

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Syntax, dependencies, lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck curl jq util-linux coreutils gawk procps

      - name: Run repository checks
        run: |
          make check
          make deps
          make lint
          make test
